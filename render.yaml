# Render Blueprint. Push this repo to GitHub, then New > Blueprint on render.com.
#
# Free web services sleep after idle HTTP traffic. Use a keep-alive ping on
# /status if you need the scanner to run continuously, or use a paid instance.
#
# Set the secret env vars in the Render dashboard (do not commit them).

services:
  - type: web
    name: battoujutsu-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /status
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: LOG_LEVEL
        value: INFO
      - key: SCAN_INTERVAL_SECONDS
        value: "1800"
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_API_KEY_SECOND
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: CRYPTO_BINANCE_VALIDATION_ENABLED
        value: "true"
      - key: CRYPTO_COINBASE_VALIDATION_ENABLED
        value: "true"
      - key: CRYPTO_BINANCE_WS_URL
        value: "wss://data-stream.binance.vision/ws"
      - key: CRYPTO_BINANCE_REST_URL
        value: "https://data-api.binance.vision"
      - key: CRYPTO_BINANCE_MAX_PRICE_DISCREPANCY_PCT
        value: "1.0"
      - key: CRYPTO_COINBASE_MAX_PRICE_DISCREPANCY_PCT
        value: "1.0"
      - key: CRYPTO_BINANCE_STALE_SECONDS
        value: "60"
      - key: CRYPTO_COINBASE_STALE_SECONDS
        value: "60"
      - key: CRYPTO_VALIDATION_HTTP_TIMEOUT_SECONDS
        value: "10"
      - key: CRYPTO_VALIDATION_CANDLE_REFRESH_SECONDS
        value: "60"
      - key: CRYPTO_VALIDATION_RECONNECT_SECONDS
        value: "5"
      - key: FXCM_BRIDGE_ENABLED
        value: "true"
      - key: FXCM_ACCOUNT_TYPE
        value: "demo"
      - key: FXCM_STALE_SECONDS
        value: "90"
      - key: FXCM_MAX_PRICE_DISCREPANCY_PCT
        value: "0.1"
      - key: FXCM_OHLC_TOLERANCE_PIPS
        value: "2.0"
      - key: FXCM_OHLC_MISMATCH_MULTIPLIER
        value: "3.0"
      - key: FXCM_BRIDGE_SHARED_SECRET
        sync: false
  - type: worker
    name: fxcm-bridge
    runtime: python
    rootDir: fxcm-bridge
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python bridge.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.7.10"
      - key: FXCM_ENABLED
        value: "true"
      - key: FXCM_USERNAME
        sync: false
      - key: FXCM_PASSWORD
        sync: false
      - key: FXCM_CONNECTION
        value: "demo"
      - key: FXCM_SERVER
        value: ""
      - key: FXCM_POLL_SECONDS
        value: "30"
      - key: SCANNER_RECEIVER_URL
        value: "https://battousai-bot.onrender.com/fxcm/market-data"
      - key: FXCM_BRIDGE_SHARED_SECRET
        sync: false
